<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-4">
    <h1>My Notes</h1> <br>
        
    <form id="noteForm">

  <div class="mb-3">
    <label for="userId" class="form-label">Note ID</label>
    <input type="number" name="userid" class="form-control" id="userId" placeholder="Enter user Note ID">
  </div>

  <div class="mb-3">
    <label for="noteTitle" class="form-label">Title</label>
    <input type="text" name="title" class="form-control" id="noteTitle" placeholder="Enter title">
  </div>

  <div class="mb-3">
    <label for="noteDesc" class="form-label">Description</label>
    <input type="text" name="description" class="form-control" id="noteDesc" placeholder="Enter description">
  </div>

  <div class="mb-3">
    <label for="noteContent" class="form-label">Your Note</label>
    <textarea name="content" class="form-control" id="noteContent" rows="5" placeholder="Write your note here"></textarea>
  </div>

  

  <button type="submit" class="btn btn-primary">Save Note</button>
</form>

 <br> <br>
<script>
  document.getElementById("noteForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const noteData = {
      userid: parseInt(document.getElementById("userId").value),
      title: document.getElementById("noteTitle").value,
      description: document.getElementById("noteDesc").value,
      content: document.getElementById("noteContent").value,
      
    };

    try {
      const response = await fetch("/notes/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(noteData)
      });

      if (response.ok) {
        alert("Note saved successfully!");
        document.getElementById("noteForm").reset();
      } else {
        const errorText = await response.text();
        alert("Error: " + errorText);
      }
    } catch (error) {
      console.error("Network Error:", error);
      alert("Network error occurred!");
    }
  });
</script>



  </div>
</body>
</html>
