<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
    }
    .sidebar {
      width: 200px;
      height: 100vh;
      background-color: #ccd1e7;
      padding-top: 20px;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="sidebar"><br>
    <h5 class="text-center"><button type="button" class="btn btn-primary">Menu</button></h5> <br>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link btn btn-outline-primary mb-2" href="/search"><button type="button" class="btn btn-warning">Search Notes</button></a>
      </li> <br>
      <li class="nav-item">
        <a class="nav-link btn btn-outline-danger" href="/delete"><button type="button" class="btn btn-danger">Delete Notes</button></a>
      </li>
    </ul>
  </div>

  <div class="content"> 
    <h2>Create a Note</h2> <br>
    <form id="noteForm">
      
      <div class="mb-3">
        <label for="noteTitle" class="form-label">Title</label>
        <input type="text" name="title" class="form-control" id="noteTitle">
      </div>
      <div class="mb-3">
        <label for="noteDesc" class="form-label">Description</label>
        <input type="text" name="description" class="form-control" id="noteDesc">
      </div>
      <div class="mb-3">
        <label for="noteContent" class="form-label">Content</label>
        <textarea name="content" class="form-control" id="noteContent" rows="4"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Note</button>
    </form>
  </div>

  <script>
    document.getElementById("noteForm").addEventListener("submit", async function (event) {
      event.preventDefault();
      const noteData = {
        
        title: document.getElementById("noteTitle").value,
        description: document.getElementById("noteDesc").value,
        content: document.getElementById("noteContent").value,
      };
      const response = await fetch("/notes/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(noteData)
      });
      if (response.ok) {
        alert("Note saved!");
        document.getElementById("noteForm").reset();
      } else {
        alert("Error saving note.");
      }
    });
  </script>

</body>
</html>
