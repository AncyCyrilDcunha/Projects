<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Delete Note</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>
<body class="p-4" style="background-color: #e7cfd8;">
  <h2>Delete Note by ID</h2> <br>
  <form id="deleteForm">
    <input type="number" class="form-control mb-2" id="deleteId" placeholder="Enter Note ID"> <br>
    <button type="submit" class="btn btn-danger">Delete</button>
  </form>

  <script>
    document.getElementById("deleteForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const id = document.getElementById("deleteId").value;
      try {
        const response = await fetch(`/notes/${id}`, { method: "DELETE" });
        if (response.ok) {
          alert("Note deleted successfully.");
        } else {
          alert("Failed to delete note.");
        }
      } catch (err) {
        alert("Error deleting note.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
